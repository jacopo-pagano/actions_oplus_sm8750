# =============================================================================
#  xkse4 Dodge Kernel — OnePlus 13 (sm8750) — ZyCromerZ Clang 19 + Oryon-1
#  Builds exactly as xkse4 intended, with:
#    • ZyCromerZ Clang 19.0.0git-20240723
#    • -mcpu=oryon-1 (Oryon scheduling) + -march=armv9.1-a+nosve (ISA)
#      patched into the top-level Makefile so both coexist without conflict
#    • CodeLinaro build-tools (aarch64 binutils)
#    • ThinLTO cache wrapper for faster incremental links
#    • xkse4_dodge_defconfig (O3 + ThinLTO + Polly + ADIOS + BBRv3 + ROCCET)
#    • AnyKernel3 flashable zip artifact
# =============================================================================
name: Build xkse4 Dodge Kernel (ZyC Clang 19 + Oryon)

on:
  workflow_dispatch:
  push:
    branches:
      - oneplus/sm8750_b_16.0.0_oneplus_13
    paths-ignore:
      - "**.md"
      - "LICENSE"

env:
  DEFCONFIG: xkse4_dodge_defconfig
  ARCH: arm64
  OUT_DIR: ${{ github.workspace }}/kout
  LDCACHE_DIR: ${{ github.workspace }}/ldcache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 10G
  CLANG_URL: "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz"
  CLANG_CACHE_KEY: zyc-clang-19.0.0git-20240723
  BUILDTOOLS_CACHE_KEY: codelinaro-build-tools-ks-kernel-lnx-4.0

jobs:
  build:
    name: Build & Package AnyKernel3
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ──────────────────────────────────────────────────────────────────────
      #  1.  Kernel source
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: xkse4/android_kernel_common_oneplus_sm8750
          ref: oneplus/sm8750_b_16.0.0_oneplus_13
          fetch-depth: 1

      # ──────────────────────────────────────────────────────────────────────
      #  2.  Swap (ThinLTO link can exceed 7 GB RSS)
      # ──────────────────────────────────────────────────────────────────────
      - name: Add 16 GB swap
        run: |
          sudo fallocate -l 16G /mnt/swap_lto || \
            sudo dd if=/dev/zero of=/mnt/swap_lto bs=1M count=16384
          sudo chmod 600 /mnt/swap_lto
          sudo mkswap /mnt/swap_lto
          sudo swapon /mnt/swap_lto
          free -h

      # ──────────────────────────────────────────────────────────────────────
      #  3.  Host dependencies
      # ──────────────────────────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache \
            cmake curl flex git gnupg libelf-dev libncurses-dev \
            libssl-dev lz4 pahole python3 rsync wget zip zstd \
            aria2 dos2unix

      # ──────────────────────────────────────────────────────────────────────
      #  4.  ZyCromerZ Clang 19 (cached)
      # ──────────────────────────────────────────────────────────────────────
      - name: Cache ZyCromerZ Clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/zyc-clang
          key: ${{ env.CLANG_CACHE_KEY }}

      - name: Download ZyCromerZ Clang 19
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zyc-clang
          aria2c -x16 -s16 -k1M -j16 --retry-wait=5 --max-tries=10 \
            -d /tmp -o zyc-clang.tar.gz "${{ env.CLANG_URL }}"
          tar -C zyc-clang -zxf /tmp/zyc-clang.tar.gz
          rm -f /tmp/zyc-clang.tar.gz
          echo "Clang version:"
          ./zyc-clang/bin/clang --version

      # ──────────────────────────────────────────────────────────────────────
      #  5.  CodeLinaro build-tools (aarch64 binutils, cached)
      # ──────────────────────────────────────────────────────────────────────
      - name: Cache build-tools
        id: buildtools-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build-tools
          key: ${{ env.BUILDTOOLS_CACHE_KEY }}

      - name: Clone CodeLinaro build-tools
        if: steps.buildtools-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b ks-kernel.lnx.4.0.r1-rel \
            https://git.codelinaro.org/clo/la/kernel/prebuilts/build-tools.git build-tools

      # ──────────────────────────────────────────────────────────────────────
      #  6.  ccache
      # ──────────────────────────────────────────────────────────────────────
      - name: Configure ccache
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -o compression=true
          ccache -o compiler_check=none
          ccache -o hash_dir=false
          ccache -o direct_mode=true
          ccache -o depend_mode=false
          ccache -o base_dir="${{ github.workspace }}"
          ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros,locale

      - name: Restore ccache
        uses: actions/cache/restore@v4
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: xkse4-dodge-zyc19-${{ github.sha }}
          restore-keys: |
            xkse4-dodge-zyc19-

      # ──────────────────────────────────────────────────────────────────────
      #  7.  Restore ThinLTO link cache
      # ──────────────────────────────────────────────────────────────────────
      - name: Restore LTO cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: lto-xkse4-dodge-${{ github.sha }}
          restore-keys: |
            lto-xkse4-dodge-

      # ──────────────────────────────────────────────────────────────────────
      #  8.  Patch top-level Makefile: Oryon-1 scheduling + ARMv9.1-A ISA
      #
      #  xkse4's top-level Makefile contains (inside ifeq ($(SRCARCH),arm64)):
      #    KBUILD_CFLAGS += -march=armv9.1-a+nosve+crypto+sha3+sm4+rng
      #
      #  We prepend -mcpu=oryon-1 so Clang uses the Oryon scheduling model
      #  while -march (coming after) retains ARMv9.1-A as the ISA target.
      #  This avoids the override problem when -mcpu is passed via KCFLAGS
      #  (which appends AFTER KBUILD_CFLAGS on the command line).
      # ──────────────────────────────────────────────────────────────────────
      - name: Patch top-level Makefile for Oryon-1 + ARMv9.1-A
        run: |
          echo "── Before patch ──"
          grep -n 'march=armv9' Makefile || true

          sed -i \
            's|KBUILD_CFLAGS += -march=armv9.1-a+nosve+crypto+sha3+sm4+rng|KBUILD_CFLAGS += -mcpu=oryon-1 -march=armv9.1-a+nosve+crypto+sha3+sm4+rng|' \
            Makefile

          echo "── After patch ──"
          grep -n 'oryon\|armv9' Makefile

          # Sanity: ensure the patch actually applied
          grep -q '\-mcpu=oryon-1 -march=armv9.1-a+nosve+crypto+sha3+sm4+rng' Makefile \
            || { echo "::error::Makefile patch failed"; exit 1; }

      # ──────────────────────────────────────────────────────────────────────
      #  9.  Configure kernel
      # ──────────────────────────────────────────────────────────────────────
      - name: Configure kernel (${{ env.DEFCONFIG }})
        run: |
          export PATH="${{ github.workspace }}/zyc-clang/bin:${{ github.workspace }}/build-tools/linux-x86/bin:$PATH"
          make LLVM=1 LLVM_IAS=1 ARCH=${{ env.ARCH }} \
            CROSS_COMPILE=aarch64-linux-gnu- \
            O=${{ env.OUT_DIR }} \
            ${{ env.DEFCONFIG }}

      # ──────────────────────────────────────────────────────────────────────
      #  10. Build (Image + modules)
      #
      #  NOTE: -mcpu=oryon-1 is NOT in KCFLAGS.
      #  It lives in the patched top-level Makefile (KBUILD_CFLAGS) so that
      #  -march=armv9.1-a+nosve+crypto+sha3+sm4+rng comes AFTER it
      #  on the command line, preserving the ARMv9.1-A ISA target.
      # ──────────────────────────────────────────────────────────────────────
      - name: Build kernel
        run: |
          export PATH="${{ github.workspace }}/zyc-clang/bin:${{ github.workspace }}/build-tools/linux-x86/bin:$PATH"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          mkdir -p "${{ env.LDCACHE_DIR }}"

          # ThinLTO cache wrapper
          cat > ld-wrapper << 'LDWRAP'
          #!/bin/bash
          ld.lld "$@" \
            --thinlto-cache-dir=${LDCACHE_DIR} \
            --thinlto-jobs=$(($(nproc --all) / 2))
          LDWRAP
          chmod +x ld-wrapper

          make -j"$(nproc --all)" \
            LLVM=1 LLVM_IAS=1 ARCH=${{ env.ARCH }} \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            LD="$(pwd)/ld-wrapper" \
            HOSTLD="$(pwd)/ld-wrapper" \
            O=${{ env.OUT_DIR }} \
            KCFLAGS="-pipe -Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-unknown-warning-option -fno-strict-aliasing -fno-delete-null-pointer-checks" \
            Image modules

          echo "── ccache stats ──"
          ccache -s

      # ──────────────────────────────────────────────────────────────────────
      #  11. Verify compiler flags in build output
      # ──────────────────────────────────────────────────────────────────────
      - name: Verify -mcpu and -march coexist
        run: |
          export PATH="${{ github.workspace }}/zyc-clang/bin:${{ github.workspace }}/build-tools/linux-x86/bin:$PATH"

          # Rebuild a single object verbosely to inspect the actual command line
          make LLVM=1 LLVM_IAS=1 ARCH=${{ env.ARCH }} \
            CROSS_COMPILE=aarch64-linux-gnu- \
            O=${{ env.OUT_DIR }} \
            V=1 \
            init/main.o 2>&1 | tee /tmp/verbose_build.log

          echo "── Extracted flags ──"
          grep -oP '\-mcpu=\S+' /tmp/verbose_build.log | sort -u
          grep -oP '\-march=\S+' /tmp/verbose_build.log | sort -u

          # Assert both are present
          grep -q '\-mcpu=oryon-1' /tmp/verbose_build.log \
            || { echo "::error::-mcpu=oryon-1 not found in build"; exit 1; }
          grep -q '\-march=armv9.1-a+nosve+crypto+sha3+sm4+rng' /tmp/verbose_build.log \
            || { echo "::error::-march=armv9.1-a not found in build"; exit 1; }

          echo "✅ Both -mcpu=oryon-1 and -march=armv9.1-a+nosve+crypto+sha3+sm4+rng confirmed"

      # ──────────────────────────────────────────────────────────────────────
      #  12. Save caches
      # ──────────────────────────────────────────────────────────────────────
      - name: Save ccache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: xkse4-dodge-zyc19-${{ github.sha }}

      - name: Save LTO cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.LDCACHE_DIR }}
          key: lto-xkse4-dodge-${{ github.sha }}

      # ──────────────────────────────────────────────────────────────────────
      #  13. Verify build output
      # ──────────────────────────────────────────────────────────────────────
      - name: Verify build artifacts
        run: |
          test -f ${{ env.OUT_DIR }}/arch/arm64/boot/Image \
            || { echo "::error::Image not found"; exit 1; }
          file ${{ env.OUT_DIR }}/arch/arm64/boot/Image
          ls -lh ${{ env.OUT_DIR }}/arch/arm64/boot/Image
          strings ${{ env.OUT_DIR }}/arch/arm64/boot/Image \
            | grep -m1 'Linux version' || true

      # ──────────────────────────────────────────────────────────────────────
      #  14. Assemble AnyKernel3
      # ──────────────────────────────────────────────────────────────────────
      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cd ak3
          rm -rf .git README.md ramdisk/* patch/* modules/system

          cat > anykernel.sh << 'EOF'
          # AnyKernel3 — OnePlus 13 (dodge / sun / sm8750)
          # xkse4 GKI 2.0 kernel — ZyCromerZ Clang 19 + Oryon-1
          kernel.string=xkse4 dodge kernel by xkse4 (ZyC19-Oryon)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=dodge
          device.name2=sun
          device.name3=OP594DL1
          device.name4=PJZ110
          device.name5=
          supported.versions=15 - 16
          supported.patchlevels=
          supported.vendorpatchlevels=
          BLOCK=auto;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          dump_boot;
          write_boot;
          EOF

          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image ./Image

      # ──────────────────────────────────────────────────────────────────────
      #  15. Create flashable zip
      # ──────────────────────────────────────────────────────────────────────
      - name: Create AnyKernel3 zip
        run: |
          cd ak3
          zip -r9 ../xkse4-dodge-ZyC19-Oryon-AnyKernel3.zip \
            * -x '.git' 'README.md' '*placeholder'

      # ──────────────────────────────────────────────────────────────────────
      #  16. Upload artifact
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: xkse4-dodge-ZyC19-Oryon-AnyKernel3
          path: xkse4-dodge-ZyC19-Oryon-AnyKernel3.zip
          retention-days: 30
          if-no-files-found: error